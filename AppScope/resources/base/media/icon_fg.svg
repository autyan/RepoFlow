<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- RepoFlow App Icon - Foreground -->
  <!-- Git branch/flow concept with modern design -->
  
  <!-- Main vertical branch line -->
  <path d="M54 12 L54 96" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Left branch curve -->
  <path d="M54 38 Q38 38 26 52" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="58" r="10" fill="#FFFFFF"/>
  
  <!-- Right branch curve -->
  <path d="M54 58 Q70 58 82 44" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="86" cy="38" r="10" fill="#FFFFFF"/>
  
  <!-- Main branch nodes -->
  <circle cx="54" cy="22" r="14" fill="#FFFFFF"/>
  <circle cx="54" cy="54" r="14" fill="#FFFFFF"/>
  <circle cx="54" cy="86" r="14" fill="#FFFFFF"/>
</svg>
